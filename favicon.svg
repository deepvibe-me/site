<svg xmlns="http://www.w3.org/2000/svg" width="215" height="140" viewBox="8.5 3.5 21.5 14">
  <!-- deepvibe 로고 마크 — 겹치는 두 원(핑크=나, 바이올렛=상대). 형상은 deepvibe_logo_Final.ai(2026-09-10) 기준.
       원 크기: r / 겹침 정도: 두 원의 cx 간격(현재 6.9) / 색: 아래 그라디언트 stop-color -->
  <defs>
    <radialGradient id="lp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6f91" stop-opacity=".95"/><stop offset="100%" stop-color="#ffb4c6" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="lv" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b967ff" stop-opacity=".95"/><stop offset="100%" stop-color="#dec4ff" stop-opacity=".7"/>
    </radialGradient>
  </defs>
  <circle cx="15.8" cy="10.5" r="6.5" fill="url(#lp)" style="mix-blend-mode:multiply"/>
  <circle cx="22.7" cy="10.5" r="6.5" fill="url(#lv)" style="mix-blend-mode:multiply"/>
</svg>
