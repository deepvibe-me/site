<style>
  /* 색은 web/app/globals.css 토큰과 같다(STYLE_GUIDE). 로고는 docs/brand 정본 복사본만 쓴다. */
  :root {
    --bg: #f6f4f1; --soft: #efebe5; --ink: #15131a; --ink2: #2a262f;
    --muted: #7a7680; --l08: rgba(20,10,30,.08); --l12: rgba(20,10,30,.12);
    --pink: #ff6f91; --violet: #b967ff;
    --kakao: #fee500; --kakao-ink: #3d1e1e;
    --serif: "Fraunces", serif;
    --sans: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  main { width: 100%; max-width: 440px; padding: 56px 20px 40px; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo { width: 180px; height: 180px; margin: -24px 0 4px; }
  .badge { font-size: 13px; letter-spacing: .02em; color: var(--muted); border: 1px solid var(--l12); border-radius: 999px; padding: 6px 14px; margin-bottom: 28px; }
  h1 { font-size: 26px; line-height: 1.45; font-weight: 600; letter-spacing: -.02em; margin-bottom: 14px; }
  .lead { font-size: 16px; line-height: 1.7; color: var(--ink2); font-weight: 400; margin-bottom: 36px; }
  .src { width: 100%; text-align: left; margin-bottom: 20px; }
  .src h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin: 0 0 10px 4px; }
  .src .row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: var(--soft); border-radius: 16px; margin-bottom: 8px; }
  .src .ic { flex: 0 0 36px; height: 36px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--violet); }
  .src .ic svg { width: 20px; height: 20px; }
  .src p { font-size: 13px; line-height: 1.55; color: var(--muted); }
  .src b { font-size: 15px; font-weight: 600; color: var(--ink); }
  .src em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--violet); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
  .tracks { width: 100%; background: #fff; border: 1px solid var(--l08); border-radius: 20px; padding: 6px 20px; margin-bottom: 32px; text-align: left; }
  .tracks div { display: flex; gap: 14px; align-items: baseline; padding: 15px 0; border-bottom: 1px solid var(--l08); }
  .tracks div:last-child { border-bottom: 0; }
  .tracks b { flex: 0 0 72px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .tracks span { font-size: 15px; line-height: 1.5; font-weight: 500; }
  .tracks div:nth-child(1) b { color: var(--pink); }
  .tracks div:nth-child(2) b { color: #d36bc8; }
  .tracks div:nth-child(3) b { color: var(--violet); }
  .cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border-radius: 16px; background: var(--kakao); color: var(--kakao-ink); font-size: 16px; font-weight: 700; text-decoration: none; }
  .cta svg { width: 20px; height: 20px; }
  .reward { font-size: 14px; color: var(--ink2); margin-top: 12px; }
  .trust { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .sns { display: flex; gap: 10px; margin-top: 40px; }
  .sns a { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--soft); color: var(--ink2); }
  .sns svg { width: 20px; height: 20px; }
  footer { width: 100%; max-width: 440px; padding: 24px 20px 32px; text-align: center; font-size: 12px; color: var(--muted); }
  footer i { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink2); }
  @media (min-width: 600px) { main { padding-top: 88px; } h1 { font-size: 30px; } }
</style>
</head>
